aid: cofertility
name: Cofertility
description: >-
  Cofertility is a human-centered fertility and family-building platform built around an egg-sharing
  model. Through its Split program, women can freeze their eggs at no cost when they donate half of the
  retrieved eggs to another family who cannot otherwise conceive; its Keep program offers self-funded
  egg freezing at a discount where members retain all of their eggs. On the family-building side,
  Cofertility matches intended parents (including LGBTQ+ families and single parents) with fresh and
  frozen egg donors, working with 225+ clinic partners nationwide and a donor community spanning 270+
  ethnicities. Founded by Lauren Makler, the company operates a consumer web platform (match.cofertility.com)
  plus an extensive fertility education library. It is a consumer health company with no public developer
  API or programmatic surface at this time; this profile captures its public web properties and posture.
